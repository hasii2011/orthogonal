[build-system]
requires = ['setuptools', 'wheel']
build-backend = "setuptools.build_meta"

[project]
name        = 'orthogonal'
dynamic     = ["version"]
description = 'Orthogonal Graph Layout for Python'
readme      = "README.md"
authors     = [{name = 'Humberto A. Sanchez II', email = 'Humberto.A.Sanchez.II@gmail.com'}]
maintainers = [{name = 'Humberto A. Sanchez II', email = 'Humberto.A.Sanchez.II@gmail.com'}]
keywords    = ['umldiagrammer', 'graphics', 'layout']
license     = 'AGPL-1.0-or-later'

dependencies = [
  'networkx>=3.4.2',
]
[project.optional-dependencies]
test = [
    'mypy==1.20.2',
    'mypy-extensions==1.1.0',
    'types-Deprecated==1.3.1.20260130',
    'html-testRunner~=1.2.1',
]

deploy = [
    "setuptools==82.0.1",
    "wheel==0.47.0",
    "twine==6.2.0",
    "build==1.4.4",
]

[project.urls]
Repository = 'https://github.com/hasii2011/orthogonal'

[tool.setuptools.packages.find]
where = ['src']

[tool.setuptools.package-data]
'orthogonal.resources' = ['loggingConfiguration.json']

[tool.setuptools.dynamic]
version = {attr = 'orthogonal.__version__'}
